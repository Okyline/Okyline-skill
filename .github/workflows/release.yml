name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build skill ZIP
        run: |
          mkdir -p build
          rsync -a --exclude='.git' \
                   --exclude='.github' \
                   --exclude='.claude' \
                   --exclude='.idea' \
                   --exclude='.gitignore' \
                   --exclude='build' \
                   --exclude='*.zip' \
                   --exclude='RELEASE.md' \
                   ./ build/okyline/
          cd build
          zip -r "okyline-skill-${GITHUB_REF_NAME}.zip" okyline
          # Same archive under a stable name: releases/latest/download/okyline-skill.zip always
          # serves the latest release, so download links never have to change.
          cp "okyline-skill-${GITHUB_REF_NAME}.zip" okyline-skill.zip

      - name: Attach ZIPs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/okyline-skill-${{ github.ref_name }}.zip
            build/okyline-skill.zip
